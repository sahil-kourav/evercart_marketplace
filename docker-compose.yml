services:
  api-gateway:
    build:
      context: ./server/api_gateway
      dockerfile: Dockerfile

    container_name: api-gateway
    ports:
      - "8088:8088"
    env_file:
      - ./server/api_gateway/.env

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8088/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    depends_on:
      - auth-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - seller-service
      - notification-service
    
    networks:
      - evercart-network

  auth-service:
